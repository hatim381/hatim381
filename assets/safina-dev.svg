<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="SAFINA Dev — data, design et expériences interactives">
<title>SAFINA Dev — data, design et expériences interactives</title>
<style>
  .rise { opacity:0; animation: rise 800ms cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes rise { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 600ms cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes fade { to { opacity:1; } }
  .spark { animation: spark ease-in-out infinite; opacity:0; }
  @keyframes spark { 0%,100% { opacity:0; } 50% { opacity:.9; } }
  .breathe { animation: breathe 3000ms ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
  @keyframes breathe { 0%,100% { opacity:.85; transform: scale(.98); } 50% { opacity:1; transform: scale(1.02); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity:1 !important; } }

  .w1 { animation: drift 9s ease-in-out infinite alternate; }
  .w2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
  .w3 { animation: drift 15s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }

  .boat { animation: float 4500ms ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
  .sail { animation: sail 4500ms ease-in-out infinite; animation-delay: -1350ms; transform-box: fill-box; transform-origin: 0% 100%; }
  @keyframes sail { 0%,100% { transform: skewX(0deg); } 50% { transform: skewX(-3deg); } }
  .moon { animation: moon 4000ms ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
  @keyframes moon { 0%,100% { opacity:.85; transform: scale(.99); } 50% { opacity:1; transform: scale(1.01); } }
  .cta { animation: cta 2500ms ease-in-out infinite; animation-delay: 1.2s; }
  @keyframes cta { 0%,100% { opacity:.75; } 50% { opacity:1; } }
  .arrow { animation: nudge 2500ms ease-in-out infinite; animation-delay: 1.2s; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
</style>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06132a"/><stop offset="1" stop-color="#0b1f3a"/></linearGradient>
  <radialGradient id="mglow"><stop offset="0" stop-color="#c9a227" stop-opacity=".35"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <clipPath id="f2"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<g clip-path="url(#f2)">
  <rect width="1200" height="300" fill="url(#sky)"/>
  <circle class="spark" cx="106" cy="108" r="2.0" fill="#c9a227" style="animation-duration:3.30s;animation-delay:0.86s"/>
  <circle class="spark" cx="432" cy="124" r="1.6" fill="#c9a227" style="animation-duration:3.36s;animation-delay:0.94s"/>
  <circle class="spark" cx="22" cy="65" r="2.4" fill="#c9a227" style="animation-duration:2.36s;animation-delay:3.18s"/>
  <circle class="spark" cx="141" cy="46" r="1.2" fill="#c9a227" style="animation-duration:3.20s;animation-delay:3.98s"/>
  <circle class="spark" cx="421" cy="70" r="2.4" fill="#c9a227" style="animation-duration:2.28s;animation-delay:1.32s"/>
  <circle class="spark" cx="279" cy="31" r="2.0" fill="#c9a227" style="animation-duration:2.25s;animation-delay:2.96s"/>
  <circle class="spark" cx="66" cy="124" r="1.2" fill="#c9a227" style="animation-duration:3.24s;animation-delay:2.21s"/>
  <circle class="spark" cx="198" cy="80" r="1.6" fill="#c9a227" style="animation-duration:3.73s;animation-delay:1.88s"/>
  <circle class="spark" cx="446" cy="25" r="1.6" fill="#c9a227" style="animation-duration:2.68s;animation-delay:3.88s"/>
  <circle class="spark" cx="485" cy="117" r="1.2" fill="#c9a227" style="animation-duration:2.48s;animation-delay:1.91s"/>
  <circle class="spark" cx="450" cy="42" r="1.6" fill="#c9a227" style="animation-duration:4.24s;animation-delay:1.64s"/>
  <circle class="spark" cx="210" cy="76" r="2.4" fill="#c9a227" style="animation-duration:2.93s;animation-delay:1.94s"/>
  <g class="moon"><circle cx="420" cy="80" r="70" fill="url(#mglow)"/><circle cx="420" cy="80" r="26" fill="#c9a227"/></g>
  <!-- Pain de Sucre -->
  <path class="fade" style="animation-delay:200ms" d="M318 240 C328 168 350 112 372 112 C394 112 414 168 426 240 Z" fill="#06132a" stroke="#c9a227" stroke-opacity=".35"/>
  <!-- pirogue à balancier -->
  <g class="boat">
    <path d="M110 228 Q190 250 270 228 L258 240 Q190 256 122 240 Z" fill="#f5f1e8"/>
    <line x1="150" y1="246" x2="150" y2="260" stroke="#f5f1e8" stroke-width="2"/>
    <line x1="230" y1="246" x2="230" y2="260" stroke="#f5f1e8" stroke-width="2"/>
    <rect x="132" y="258" width="118" height="5" rx="2.5" fill="#f5f1e8" opacity=".8"/>
    <line x1="192" y1="232" x2="192" y2="120" stroke="#f5f1e8" stroke-width="2.5"/>
    <path class="sail" d="M194 124 Q252 168 250 224 L194 224 Z" fill="#c9a227"/>
  </g>
  
  <g class="w1"><path d="M0 300 L0 256 Q60 246 120 256 T240 256 Q300 246 360 256 T480 256 Q540 246 600 256 T720 256 Q780 246 840 256 T960 256 Q1020 246 1080 256 T1200 256 Q1260 246 1320 256 T1440 256 Q1500 246 1560 256 T1680 256 L1680 300 Z" fill="#c9a227" opacity=".10"/></g>
  <g class="w2"><path d="M0 300 L0 270 Q45 262 90 270 T180 270 Q225 262 270 270 T360 270 Q405 262 450 270 T540 270 Q585 262 630 270 T720 270 Q765 262 810 270 T900 270 Q945 262 990 270 T1080 270 Q1125 262 1170 270 T1260 270 Q1305 262 1350 270 T1440 270 L1440 300 Z" fill="#c9a227" opacity=".16"/></g>
  <g class="w3"><path d="M0 300 L0 284 Q75 278 150 284 T300 284 Q375 278 450 284 T600 284 Q675 278 750 284 T900 284 Q975 278 1050 284 T1200 284 Q1275 278 1350 284 T1500 284 Q1575 278 1650 284 T1800 284 L1800 300 Z" fill="#06132a" opacity=".9"/></g>
  <line x1="600" y1="50" x2="600" y2="250" stroke="#c9a227" stroke-opacity=".2"/>
  <text class="rise" style="animation-delay:100ms" x="660" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#c9a227">MON STUDIO</text>
  <text class="rise" style="animation-delay:250ms" x="660" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="800" fill="#f5f1e8" letter-spacing="2">SAFINA <tspan fill="#c9a227">Dev</tspan></text>
  <text class="rise" style="animation-delay:400ms" x="660" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#8fa3c0">Data, design &amp; expériences interactives</text>
  <g class="rise" style="animation-delay:550ms">
    <g class="cta"><rect x="660" y="200" width="226" height="46" rx="23" fill="none" stroke="#c9a227" stroke-width="1.5"/>
    <text x="688" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#c9a227">safinadev.com</text></g>
    <g class="arrow"><path d="M846 223 h18 m-7 -7 l7 7 l-7 7" stroke="#c9a227" stroke-width="2" fill="none" stroke-linecap="round"/></g>
  </g>
</g>
</svg>
