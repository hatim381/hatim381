<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hatim Adnane — Data Engineer">
<title>Hatim Adnane — Data Engineer</title>
<style>
  .in { opacity:0; animation: in 700ms cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes in { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:none; } }
  .draw { animation: draw 1600ms cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .pulse { animation: pulse 2600ms ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1); } 50% { opacity:0; transform: scale(2.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity:1 !important; stroke-dashoffset:0 !important; } }
</style>
<defs><clipPath id="r"><rect width="1200" height="300" rx="14"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b31"/><stop offset="1" stop-color="#0a1628"/></linearGradient></defs>
<g clip-path="url(#r)">
<rect width="1200" height="300" fill="url(#bg)"/>

<g stroke="#1f3352" stroke-opacity=".45"><line x1="720" y1="0" x2="720" y2="300"/><line x1="760" y1="0" x2="760" y2="300"/><line x1="800" y1="0" x2="800" y2="300"/><line x1="840" y1="0" x2="840" y2="300"/><line x1="880" y1="0" x2="880" y2="300"/><line x1="920" y1="0" x2="920" y2="300"/><line x1="960" y1="0" x2="960" y2="300"/><line x1="1000" y1="0" x2="1000" y2="300"/><line x1="1040" y1="0" x2="1040" y2="300"/><line x1="1080" y1="0" x2="1080" y2="300"/><line x1="1120" y1="0" x2="1120" y2="300"/><line x1="1160" y1="0" x2="1160" y2="300"/><line x1="720" y1="40" x2="1200" y2="40"/><line x1="720" y1="80" x2="1200" y2="80"/><line x1="720" y1="120" x2="1200" y2="120"/><line x1="720" y1="160" x2="1200" y2="160"/><line x1="720" y1="200" x2="1200" y2="200"/><line x1="720" y1="240" x2="1200" y2="240"/><line x1="720" y1="280" x2="1200" y2="280"/></g>
<rect x="0" y="0" width="720" height="300" fill="url(#bg)"/>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a227" stop-opacity=".18"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></linearGradient>
<path class="in" style="animation-delay:900ms" d="M760 175 L795 169 L829 174 L864 157 L898 160 L933 142 L967 146 L1002 128 L1036 133 L1071 115 L1105 109 L1140 97 L1140 220 L760 220 Z" fill="url(#fade)"/>
<path class="draw" style="animation-delay:300ms;stroke-dasharray:401;stroke-dashoffset:401" d="M760 175 L795 169 L829 174 L864 157 L898 160 L933 142 L967 146 L1002 128 L1036 133 L1071 115 L1105 109 L1140 97" fill="none" stroke="#c9a227" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="in" style="animation-delay:1800ms" cx="1140" cy="97" r="5" fill="#c9a227"/>
<circle class="pulse" style="animation-delay:2000ms" cx="1140" cy="97" r="5" fill="#c9a227"/>
<text class="in" x="72" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#c9a227">DATA ENGINEER</text>
<text class="in" style="animation-delay:100ms" x="70" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#eef1f6">Hatim Adnane</text>
<text class="in" style="animation-delay:200ms" x="72" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#8796ad">Données de santé, pipelines et IA locale.</text>
<g class="in" style="animation-delay:300ms" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8796ad">
  <text x="72" y="246" xml:space="preserve">ARS Nouvelle-Aquitaine, 4 ans   /   M2 EFREI Bordeaux   /   Certifié PL-300</text>
</g>

</g>
<rect x=".5" y=".5" width="1199" height="299" rx="13.5" fill="none" stroke="#1f3352"/>
