<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hatim Adnane — Data Engineer">
<title>Hatim Adnane — Data Engineer</title>
<style>
  .rise { opacity:0; animation: rise 800ms cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes rise { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 600ms cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes fade { to { opacity:1; } }
  .spark { animation: spark ease-in-out infinite; opacity:0; }
  @keyframes spark { 0%,100% { opacity:0; } 50% { opacity:.9; } }
  .breathe { animation: breathe 3000ms ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
  @keyframes breathe { 0%,100% { opacity:.85; transform: scale(.98); } 50% { opacity:1; transform: scale(1.02); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity:1 !important; } }

  .w1 { animation: drift 9s ease-in-out infinite alternate; }
  .w2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
  .w3 { animation: drift 15s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }

  .glow { animation: glow 16s ease-in-out infinite alternate; }
  @keyframes glow { from { transform: translate(-120px, 0); } to { transform: translate(160px, 20px); } }
  .shine { animation: shine 6s cubic-bezier(0.4,0,0.2,1) infinite; animation-delay: 1.4s; }
  @keyframes shine { 0% { transform: translateX(-400px); } 35%,100% { transform: translateX(1300px); } }
  .line { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 700ms cubic-bezier(0.4,0,0.2,1) 500ms forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1f3a"/><stop offset="1" stop-color="#06132a"/>
  </linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#c9a227" stop-opacity=".22"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="name"><text x="600" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="8">HATIM ADNANE</text></clipPath>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#f5f1e8" opacity=".07"/></pattern>
  <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <g class="glow"><ellipse cx="600" cy="130" rx="420" ry="170" fill="url(#halo)"/></g>
  <circle class="spark" cx="396" cy="47" r="1.2" fill="#c9a227" style="animation-duration:2.37s;animation-delay:2.14s"/>
  <circle class="spark" cx="444" cy="27" r="1.6" fill="#c9a227" style="animation-duration:2.29s;animation-delay:1.73s"/>
  <circle class="spark" cx="101" cy="35" r="2.4" fill="#c9a227" style="animation-duration:2.34s;animation-delay:2.26s"/>
  <circle class="spark" cx="1119" cy="151" r="1.2" fill="#c9a227" style="animation-duration:3.53s;animation-delay:1.59s"/>
  <circle class="spark" cx="1152" cy="25" r="1.6" fill="#c9a227" style="animation-duration:2.87s;animation-delay:0.58s"/>
  <circle class="spark" cx="157" cy="81" r="1.6" fill="#c9a227" style="animation-duration:2.44s;animation-delay:2.28s"/>
  <circle class="spark" cx="238" cy="36" r="1.2" fill="#c9a227" style="animation-duration:3.50s;animation-delay:2.48s"/>
  <circle class="spark" cx="596" cy="129" r="2.0" fill="#c9a227" style="animation-duration:3.27s;animation-delay:3.69s"/>
  <circle class="spark" cx="439" cy="68" r="1.6" fill="#c9a227" style="animation-duration:3.81s;animation-delay:0.98s"/>
  <circle class="spark" cx="686" cy="128" r="2.0" fill="#c9a227" style="animation-duration:3.88s;animation-delay:1.15s"/>
  <circle class="spark" cx="1157" cy="40" r="2.4" fill="#c9a227" style="animation-duration:2.58s;animation-delay:1.37s"/>
  <circle class="spark" cx="1103" cy="106" r="1.2" fill="#c9a227" style="animation-duration:3.96s;animation-delay:2.29s"/>
  <circle class="spark" cx="1036" cy="82" r="2.0" fill="#c9a227" style="animation-duration:3.57s;animation-delay:2.32s"/>
  <circle class="spark" cx="549" cy="196" r="2.0" fill="#c9a227" style="animation-duration:3.29s;animation-delay:2.66s"/>
  <circle class="spark" cx="90" cy="166" r="2.4" fill="#c9a227" style="animation-duration:2.85s;animation-delay:1.54s"/>
  <circle class="spark" cx="796" cy="20" r="2.4" fill="#c9a227" style="animation-duration:3.02s;animation-delay:2.44s"/>
  <g class="rise" style="animation-delay:0ms">
    <g fill="#f5f1e8"><text x="600" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="8">HATIM ADNANE</text></g>
    <g clip-path="url(#name)"><rect class="shine" x="0" y="60" width="240" height="120" fill="url(#sh)"/></g>
  </g>
  <line class="line" x1="470" y1="176" x2="730" y2="176" stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>
  <text class="rise" style="animation-delay:150ms" x="600" y="214" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#c9a227" letter-spacing="2">Data Engineer · Santé publique · IA locale</text>
  <text class="rise" style="animation-delay:300ms" x="600" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#8fa3c0">Bordeaux  —  fondateur de SAFINA Dev</text>
  
  <g class="w1"><path d="M0 320 L0 278 Q60 268 120 278 T240 278 Q300 268 360 278 T480 278 Q540 268 600 278 T720 278 Q780 268 840 278 T960 278 Q1020 268 1080 278 T1200 278 Q1260 268 1320 278 T1440 278 Q1500 268 1560 278 T1680 278 L1680 320 Z" fill="#c9a227" opacity=".10"/></g>
  <g class="w2"><path d="M0 320 L0 292 Q45 284 90 292 T180 292 Q225 284 270 292 T360 292 Q405 284 450 292 T540 292 Q585 284 630 292 T720 292 Q765 284 810 292 T900 292 Q945 284 990 292 T1080 292 Q1125 284 1170 292 T1260 292 Q1305 284 1350 292 T1440 292 L1440 320 Z" fill="#c9a227" opacity=".16"/></g>
  <g class="w3"><path d="M0 320 L0 306 Q75 300 150 306 T300 306 Q375 300 450 306 T600 306 Q675 300 750 306 T900 306 Q975 300 1050 306 T1200 306 Q1275 300 1350 306 T1500 306 Q1575 300 1650 306 T1800 306 L1800 320 Z" fill="#06132a" opacity=".9"/></g>
</g>
</svg>
