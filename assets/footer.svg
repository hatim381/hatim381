<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Fait à Bordeaux">
<title>Fait à Bordeaux</title>
<style>
  .rise { opacity:0; animation: rise 800ms cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes rise { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 600ms cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes fade { to { opacity:1; } }
  .spark { animation: spark ease-in-out infinite; opacity:0; }
  @keyframes spark { 0%,100% { opacity:0; } 50% { opacity:.9; } }
  .breathe { animation: breathe 3000ms ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
  @keyframes breathe { 0%,100% { opacity:.85; transform: scale(.98); } 50% { opacity:1; transform: scale(1.02); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity:1 !important; } }

  .w1 { animation: drift 9s ease-in-out infinite alternate; }
  .w2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
  .w3 { animation: drift 15s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
</style>

<defs><clipPath id="f3"><rect width="1200" height="120" rx="18"/></clipPath></defs>
<g clip-path="url(#f3)">
  <rect width="1200" height="120" fill="#0b1f3a"/>
  <circle class="spark" cx="296" cy="34" r="2.0" fill="#c9a227" style="animation-duration:4.31s;animation-delay:1.90s"/>
  <circle class="spark" cx="694" cy="36" r="2.4" fill="#c9a227" style="animation-duration:2.80s;animation-delay:0.94s"/>
  <circle class="spark" cx="1175" cy="31" r="2.4" fill="#c9a227" style="animation-duration:3.11s;animation-delay:3.44s"/>
  <circle class="spark" cx="289" cy="20" r="2.4" fill="#c9a227" style="animation-duration:3.90s;animation-delay:2.69s"/>
  <circle class="spark" cx="94" cy="42" r="1.2" fill="#c9a227" style="animation-duration:2.89s;animation-delay:0.12s"/>
  <circle class="spark" cx="1024" cy="32" r="2.4" fill="#c9a227" style="animation-duration:3.84s;animation-delay:3.68s"/>
  <circle class="spark" cx="478" cy="43" r="2.4" fill="#c9a227" style="animation-duration:4.42s;animation-delay:0.54s"/>
  <circle class="spark" cx="444" cy="16" r="2.4" fill="#c9a227" style="animation-duration:2.70s;animation-delay:3.86s"/>
  <text class="fade" x="600" y="44" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="3" fill="#8fa3c0">FAIT À BORDEAUX</text>
  
  <g class="w1"><path d="M0 120 L0 70 Q60 60 120 70 T240 70 Q300 60 360 70 T480 70 Q540 60 600 70 T720 70 Q780 60 840 70 T960 70 Q1020 60 1080 70 T1200 70 Q1260 60 1320 70 T1440 70 Q1500 60 1560 70 T1680 70 L1680 120 Z" fill="#c9a227" opacity=".10"/></g>
  <g class="w2"><path d="M0 120 L0 84 Q45 76 90 84 T180 84 Q225 76 270 84 T360 84 Q405 76 450 84 T540 84 Q585 76 630 84 T720 84 Q765 76 810 84 T900 84 Q945 76 990 84 T1080 84 Q1125 76 1170 84 T1260 84 Q1305 76 1350 84 T1440 84 L1440 120 Z" fill="#c9a227" opacity=".16"/></g>
  <g class="w3"><path d="M0 120 L0 98 Q75 92 150 98 T300 98 Q375 92 450 98 T600 98 Q675 92 750 98 T900 98 Q975 92 1050 98 T1200 98 Q1275 92 1350 98 T1500 98 Q1575 92 1650 98 T1800 98 L1800 120 Z" fill="#06132a" opacity=".9"/></g>
</g>
